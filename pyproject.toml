[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "studymind-ai"
version = "0.2.0"
description = "Учебный RAG-ассистент с выбором OpenAI или Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "qdrant-client>=1.12",
    "pypdf>=5",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "python-telegram-bot>=21",
    "httpx>=0.27",
    "requests>=2.32",
    "langchain>=1.2,<2",
    "langchain-openai>=0.3,<2",
    "langchain-ollama>=0.3,<2",
    "langgraph>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
